services:
  gateway-load-balancer:
    image: nginx:1.29-alpine
    container_name: eplatform-gateway-load-balancer
    ports:
      - "8092:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
