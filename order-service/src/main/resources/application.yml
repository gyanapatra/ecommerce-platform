spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_order}
    username: ${DB_USERNAME:ecommerce_user}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8085}

app:
  jwt:
    secret: ${JWT_SECRET}

services:
  cart:
    base-url: ${CART_SERVICE_URL:http://localhost:8084}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html