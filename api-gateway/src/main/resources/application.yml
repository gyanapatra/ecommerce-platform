server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/inventory/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/orders/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications/**
            - id: member-service
              uri: ${MEMBER_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/members/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/payments/**

app:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
