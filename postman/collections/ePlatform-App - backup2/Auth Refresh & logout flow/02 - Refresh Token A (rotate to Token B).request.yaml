$kind: http-request
url: "{{baseUrl}}/api/v1/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{tokenA}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('First refresh returns 200', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('Rotation returns a new refresh token', function () {
        pm.expect(body.refreshToken).to.be.a('string').and.not.empty;
        pm.expect(body.refreshToken).to.not.equal(pm.collectionVariables.get('tokenA'));
      });
      pm.collectionVariables.set('tokenB', body.refreshToken);
    language: text/javascript
order: 2000
