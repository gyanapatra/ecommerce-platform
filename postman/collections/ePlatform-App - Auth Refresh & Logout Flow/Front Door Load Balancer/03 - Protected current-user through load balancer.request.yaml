$kind: http-request
url: "{{baseUrl}}/api/v1/auth/me"
method: GET
headers:
  Authorization: Bearer {{loadBalancerAccessToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Protected current-user request through load balancer returns 200', function () { pm.response.to.have.status(200); });
      pm.test('Current-user response is an object', function () { pm.expect(pm.response.json()).to.be.an('object'); });
    language: text/javascript
order: 3000
