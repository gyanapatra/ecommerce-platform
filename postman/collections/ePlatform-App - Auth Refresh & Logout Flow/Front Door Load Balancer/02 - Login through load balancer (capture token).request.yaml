$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login through load balancer returns 200', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('Login response contains accessToken', function () { pm.expect(body.accessToken).to.be.a('string').and.not.empty; });
      pm.collectionVariables.set('loadBalancerAccessToken', body.accessToken);
    language: text/javascript
order: 2000
