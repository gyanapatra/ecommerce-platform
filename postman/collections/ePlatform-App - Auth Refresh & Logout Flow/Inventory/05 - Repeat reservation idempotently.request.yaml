$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/{{inventoryProductId}}/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reservationId": "{{inventoryReservationId}}",
      "quantity": 3
    }
auth:
  type: bearer
  credentials:
    token: "{{inventoryAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Repeating the same reservation is idempotent', function () { pm.response.to.have.status(201); });
      pm.expect(pm.response.json().data.reservationId).to.eql(pm.collectionVariables.get('inventoryReservationId'));
    language: text/javascript
order: 6000
