$kind: http-request
url: "{{baseUrl}}/api/v1/inventory/{{inventoryProductId}}/adjustments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "adjustmentId": "{{inventoryAdjustmentId}}",
      "quantityDelta": 10
    }
auth:
  type: bearer
  credentials:
    token: "{{inventoryAccessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('inventoryProductId', pm.variables.replaceIn('{{$guid}}'));
      pm.collectionVariables.set('inventoryAdjustmentId', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Stock adjustment returns 200', function () { pm.response.to.have.status(200); });
      const data = pm.response.json().data;
      pm.expect(data.productId).to.eql(pm.collectionVariables.get('inventoryProductId'));
      pm.expect(data.onHand).to.eql(10);
      pm.expect(data.reserved).to.eql(0);
      pm.expect(data.available).to.eql(10);
    language: text/javascript
order: 3000
