$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.unset('inventoryProductId');
      pm.collectionVariables.unset('inventoryAdjustmentId');
      pm.collectionVariables.unset('inventoryReservationId');
      pm.collectionVariables.unset('inventoryReleaseReservationId');
      pm.collectionVariables.unset('inventoryFailedReservationId');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Inventory test login returns 200', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.expect(body.accessToken).to.be.a('string').and.not.empty;
      pm.collectionVariables.set('inventoryAccessToken', body.accessToken);
    language: text/javascript
order: 1000
