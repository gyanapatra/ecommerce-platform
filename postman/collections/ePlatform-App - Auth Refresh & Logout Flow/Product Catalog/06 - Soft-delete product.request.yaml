$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{productAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Soft delete returns 204', function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 7000
