$kind: http-request
url: "{{baseUrl}}/api/v1/products?category=Postman Tests"
method: GET
queryParams:
  category: Postman Tests
auth:
  type: bearer
  credentials:
    token: "{{productAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Category listing returns 200', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('Category listing includes the created product', function () {
        pm.expect(body.data.some(function (product) { return product.id === pm.collectionVariables.get('productId'); })).to.eql(true);
      });
    language: text/javascript
order: 5000
