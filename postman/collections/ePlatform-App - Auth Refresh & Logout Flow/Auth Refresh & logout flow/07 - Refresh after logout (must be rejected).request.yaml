$kind: http-request
url: "{{baseUrl}}/api/v1/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{logoutToken}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Refresh after logout returns 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 7000
