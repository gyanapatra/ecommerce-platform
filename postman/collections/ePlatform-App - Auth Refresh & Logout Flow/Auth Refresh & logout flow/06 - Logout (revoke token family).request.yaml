$kind: http-request
url: "{{baseUrl}}/api/v1/auth/logout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{logoutToken}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Logout returns 204 No Content', function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 6000
