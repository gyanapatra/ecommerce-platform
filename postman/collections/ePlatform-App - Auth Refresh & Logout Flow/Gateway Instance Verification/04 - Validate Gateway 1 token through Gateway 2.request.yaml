$kind: http-request
url: "{{baseUrl-8091}}/api/v1/auth/me"
method: GET
headers:
  Authorization: Bearer {{gatewayAccessToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Gateway 2 accepts token issued through Gateway 1', function () { pm.response.to.have.status(200); });
      pm.test('Current-user response is returned', function () { pm.expect(pm.response.json()).to.be.an('object'); });
    language: text/javascript
order: 4000
